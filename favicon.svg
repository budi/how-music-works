<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Site icon: a G clef on a five-line staff.
    Build (scripts/build.js) also renders this as favicon.ico and apple-touch-icon.png;
    for the Apple icon it squares the corners (iOS rounds them itself).

    Grid: one staff space = 64 units, so at 32 px every line falls on a whole pixel.
    Clef: the gClef glyph (U+E050) from Bravura by Steinberg, SIL Open Font License 1.1,
    placed with its origin on the G line (2nd line from the bottom). Its outline in the
    background colour keeps it clear of the staff lines at small sizes.
  -->
  <rect class="bg" width="512" height="512" rx="96" fill="#14342b"/>
  <g fill="#9fb3aa">
    <rect x="48" y="112" width="416" height="16"/>
    <rect x="48" y="176" width="416" height="16"/>
    <rect x="48" y="240" width="416" height="16"/>
    <rect x="48" y="304" width="416" height="16"/>
    <rect x="48" y="368" width="416" height="16"/>
  </g>
